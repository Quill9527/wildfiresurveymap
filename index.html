<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leaflet Map with Reverse Geocoding</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
    <style>
        #map {
            height: 500px;
            width: 100%;
        }
    </style>
</head>
<body>
    <h1>Leaflet Map Example</h1>
    <div id="map"></div>
    <div id="result"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // Initialize the map
        var map = L.map('map').setView([37, -120], 7);

        // Add a tile layer to the map
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OpenStreetMap contributors'
        }).addTo(map);

        // Add a click event to the map
        map.on('click', function (e) {
            var lat = e.latlng.lat;
            var lon = e.latlng.lng;

            // Display coordinates
            console.log("Lat:", lat, "Lon:", lon);

            // Call the reverse geocoding function
            reverseGeocode(lat, lon);
        });

        // Reverse Geocoding function using Nominatim
        function reverseGeocode(lat, lon) {
            var url = `https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat=${lat}&lon=${lon}`;
            fetch(url)
                .then(response => response.json())
                .then(data => {
                    if (data.address) {
                        console.log("Address:", data.display_name);
                        document.getElementById('result').innerText = "Address: " + data.display_name;
                    } else {
                        console.log("No address found.");
                    }
                })
                .catch(error => console.error("Error:", error));
        }
    </script>
</body>
</html>
