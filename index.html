<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Qualtrics Survey with Map Integration</title>
    <style>
        #map-container {
            margin-top: 20px;
        }
        #map {
            height: 400px;
            width: 100%;
        }
        #clearButton {
            margin-top: 10px;
        }
        #result {
            margin-top: 20px;
        }
        #addressList {
            max-height: 150px;
            overflow-y: auto;
            margin-top: 10px;
            border: 1px solid #ccc;
            padding: 10px;
        }
        .address-item {
            margin-bottom: 5px;
            cursor: pointer;
        }
    </style>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet-control-geocoder/dist/Control.Geocoder.css" />
    <script src="https://cdn.jsdelivr.net/npm/leaflet-control-geocoder/dist/Control.Geocoder.js"></script>
</head>
<body>
    <div id="map-container">
        <div id="map"></div> <!-- Map container -->
        <button id="clearButton">Clear Map</button>
        <div id="result"></div> <!-- Container for path results -->
        <div id="addressList"></div> <!-- Container for address list -->
    </div>

    <script type="text/javascript">
        // Initialize the map with the center at Los Angeles
        var map = L.map('map').setView([34.0522, -118.2437], 10);

        // Add OpenStreetMap tile layer
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OpenStreetMap contributors'
        }).addTo(map);

        // Initialize variables for markers, polyline, distance, and addresses
        var markers = [];
        var polyline = L.polyline([], { color: 'blue', weight: 4 }).addTo(map);
        var distance = 0;
        var addresses = [];

        // Add geocoder control for address search
        var geocoder = L.Control.geocoder({
            defaultMarkGeocode: false,
            placeholder: "Enter address or postal code..."
        }).on('markgeocode', function (event) {
            var latlng = event.geocode.center;
            map.setView(latlng, 13);
            L.marker(latlng).addTo(map).bindPopup(event.geocode.name).openPopup();
        }).addTo(map);

        // Map click event for adding markers and calculating path
        map.on('click', function (e) {
            var latlng = e.latlng;
            var marker = L.marker(latlng).addTo(map);
            markers.push({ marker: marker, latlng: latlng });
            polyline.addLatLng(latlng);
            calculateDistance();
            getAddress(latlng);
        });

        // Right-click to finish the path drawing
        map.on('contextmenu', function () {
            if (markers.length > 1) {
                alert('Path completed!');
                
                // Send data via postMessage to parent window
                var pathData = polyline.getLatLngs().map(function (latlng) {
                    return `${latlng.lat.toFixed(6)}, ${latlng.lng.toFixed(6)}`;
                }).join(" -> ");
                
                var addressData = addresses.map(function (addr) {
                    let addressParts = [];
                    if (addr.house_number || addr.road) {
                        addressParts.push(`${addr.house_number || ''} ${addr.road || ''}`.trim());
                    }
                    if (addr.city) { addressParts.push(addr.city); }
                    if (addr.county) { addressParts.push(addr.county); }
                    if (addr.state) { addressParts.push(addr.state); }
                    if (addr.country) { addressParts.push(addr.country); }
                    if (addr.postcode) { addressParts.push(addr.postcode); }
                    return addressParts.join(', ').replace(/, $/, '') || 'No address found';
                }).join(" | ");

                // Post data to parent window
                window.parent.postMessage({
                    type: 'mapData',  // Message type to identify data
                    pathData: pathData,
                    addressData: addressData,
                    distance: distance.toFixed(2)
                }, '*');  // '*' allows all domains to receive the message
            } else {
                alert('At least two points are needed to complete the path.');
            }
        });

        // Clear map data (markers, polyline)
        document.getElementById('clearButton').addEventListener('click', function () {
            if (confirm('Are you sure you want to clear all paths and markers?')) {
                clearAll();
            }
        });

        // Calculate total path distance
        function calculateDistance() {
            var totalDistance = 0;
            var pathPoints = polyline.getLatLngs();
            for (var i = 1; i < pathPoints.length; i++) {
                totalDistance += pathPoints[i - 1].distanceTo(pathPoints[i]);
            }
            distance = totalDistance / 1000; // Convert to kilometers
            document.getElementById('result').innerHTML = `Distance: ${distance.toFixed(2)} km`;
        }

        // Clear all markers and polyline
        function clearAll() {
            markers.forEach(m => map.removeLayer(m.marker));
            markers = [];
            polyline.setLatLngs([]);
            document.getElementById('result').innerHTML = 'All paths cleared.';
            distance = 0;
            addresses = [];
            document.getElementById('addressList').innerHTML = ''; // Clear address list
        }

        // Get address details based on coordinates
        function getAddress(latlng) {
            const apiUrl = `https://nominatim.openstreetmap.org/reverse?lat=${latlng.lat}&lon=${latlng.lng}&format=json&addressdetails=1&accept-language=en`;
            fetch(apiUrl)
                .then(response => response.json())
                .then(data => {
                    if (data && data.address) {
                        addresses.push(data.address);
                        displayAddress(data.address); // Display address in the list
                    } else {
                        console.log('No address found for:', latlng); // Debugging line
                    }
                })
                .catch(err => console.error('Error fetching address:', err));
        }

        // Display address in the addressList container
        function displayAddress(address) {
            let addressParts = [];
            if (address.house_number || address.road) {
                addressParts.push(`${address.house_number || ''} ${address.road || ''}`.trim());
            }
            if (address.city) { addressParts.push(address.city); }
            if (address.county) { addressParts.push(address.county); }
            if (address.state) { addressParts.push(address.state); }
            if (address.country) { addressParts.push(address.country); }
            if (address.postcode) { addressParts.push(address.postcode); }
            const addressString = addressParts.join(', ').replace(/, $/, '') || 'No address found';
            
            const addressList = document.getElementById('addressList');
            const addressItem = document.createElement('div');
            addressItem.textContent = addressString;
            addressItem.classList.add('address-item');
            addressItem.addEventListener('click', function() {
                removeMarker(addressItem, address);
            });
            addressList.appendChild(addressItem);
        }

        // Remove marker and address
        function removeMarker(addressItem, address) {
            const index = addresses.indexOf(address);
            if (index > -1) {
                addresses.splice(index, 1);
                const marker = markers[index].marker;
                map.removeLayer(marker);
                markers.splice(index, 1);
                polyline.setLatLngs(markers.map(m => m.latlng));
                calculateDistance();
                addressItem.remove();
            }
        }
    </script>
</body>
</html>
