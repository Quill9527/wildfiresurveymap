<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Map Test with Leaflet</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
    <style>
        #map {
            height: 500px;
            width: 100%;
        }
        #clearButton {
            margin-top: 10px;
        }
        #result, #addressList {
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <h1>Map Test</h1>
    <div id="map"></div>
    <button id="clearButton">Clear Map</button>
    <div id="result"></div>
    <div id="addressList"></div>

    <form id="qualtricsForm">
        <textarea id="QR~QID2" rows="10" cols="50"></textarea>
        <br>
        <button type="button" onclick="saveDataToQualtrics()">Save Data</button>
    </form>

    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
    <script src="https://unpkg.com/leaflet-control-geocoder/dist/Control.Geocoder.js"></script>
    <script>
        // Initialize the map and set initial view
        var map = L.map('map').setView([37, -120], 7); // Default coordinates for US

        // Add OpenStreetMap tile layer
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OpenStreetMap contributors'
        }).addTo(map);

        // Initialize markers, polyline, and other variables
        var markers = [];
        var polyline = L.polyline([], { color: 'blue', weight: 4 }).addTo(map);
        var distance = 0; // To store the total distance
        var addresses = []; // To store the list of addresses

        // Add geocoder control
        var geocoder = L.Control.geocoder({
            defaultMarkGeocode: false,
            placeholder: "Enter address or postal code..."
        }).on('markgeocode', function (event) {
            var latlng = event.geocode.center;
            map.setView(latlng, 13);
            L.marker(latlng).addTo(map).bindPopup(event.geocode.name).openPopup();
        }).addTo(map);

        // Map click event to add marker and path
        map.on('click', function (e) {
            var latlng = e.latlng;
            var marker = L.marker(latlng).addTo(map);
            markers.push({ marker: marker, latlng: latlng });
            polyline.addLatLng(latlng);
            calculateDistance(); // Update total distance after each click
            getAddress(latlng); // Get address information from coordinates
        });

        // Map right-click event to end path drawing
        map.on('contextmenu', function () {
            if (markers.length > 1) {
                alert('Path completed!');
            } else {
                alert('At least two points are needed to complete the path.');
            }
        });

        // Clear button event to remove all markers and paths
        document.getElementById('clearButton').addEventListener('click', function () {
            if (confirm('Are you sure you want to clear all paths and markers?')) {
                clearAll();
            }
        });

        // Function to calculate the total distance of the polyline
        function calculateDistance() {
            var totalDistance = 0;
            var pathPoints = polyline.getLatLngs();
            for (var i = 1; i < pathPoints.length; i++) {
                totalDistance += pathPoints[i - 1].distanceTo(pathPoints[i]);
            }
            distance = totalDistance / 1000; // Convert to kilometers
            document.getElementById('result').innerHTML = `Distance: ${distance.toFixed(2)} km`;
        }

        // Function to clear all markers and polyline
        function clearAll() {
            markers.forEach(m => map.removeLayer(m.marker));
            markers = [];
            polyline.setLatLngs([]);
            document.getElementById('result').innerHTML = 'All paths cleared.';
            distance = 0;
            addresses = [];
            document.getElementById('addressList').innerHTML = '';
        }

        // Function to get address from latitude and longitude using OpenStreetMap Nominatim API
        function getAddress(latlng) {
            const apiUrl = `https://nominatim.openstreetmap.org/reverse?lat=${latlng.lat}&lon=${latlng.lng}&format=json&addressdetails=1&accept-language=en`;
            fetch(apiUrl)
                .then(response => response.json())
                .then(data => {
                    if (data && data.address) {
                        addresses.push(data.address);
                        displayAddresses();
                    }
                })
                .catch(console.error);
        }

        // Function to display list of addresses
        function displayAddresses() {
            const addressListContainer = document.getElementById('addressList');
            addressListContainer.innerHTML = '';
            addresses.forEach(function (address, index) {
                let fullAddress = [
                    address.house_number ? `${address.house_number} ${address.road || ''}`.trim() : '',
                    address.city,
                    address.county,
                    address.state,
                    address.country,
                    address.postcode
                ].filter(Boolean).join(', ');
                const addressElement = document.createElement('div');
                addressElement.textContent = `${index + 1}. ${fullAddress || 'No address found'}`;
                addressListContainer.appendChild(addressElement);
            });
        }

        // Save data to Qualtrics
        function saveDataToQualtrics() {
            // Get path coordinates and convert to string format
            var pathData = polyline.getLatLngs().map(function (latlng) {
                return `${latlng.lat.toFixed(6)}, ${latlng.lng.toFixed(6)}`;
            }).join(" -> ");
            
            // Get full address data, ensuring proper handling of each address
            var addressData = addresses.map(function (addr) {
                // Collect address parts, checking for empty fields and skipping them
                let addressParts = [];

                if (addr.house_number || addr.road) {
                    addressParts.push(`${addr.house_number || ''} ${addr.road || ''}`.trim());
                }
                if (addr.city) {
                    addressParts.push(addr.city);
                }
                if (addr.county) {
                    addressParts.push(addr.county);
                }
                if (addr.state) {
                    addressParts.push(addr.state);
                }
                if (addr.country) {
                    addressParts.push(addr.country); // United States
                }
                if (addr.postcode) {
                    addressParts.push(addr.postcode); // Postal code
                }

                let fullAddress = addressParts.join(', ').replace(/, $/, ''); // Clean up trailing comma
                return fullAddress || 'No address found';
            }).join(" | ");

            // Save data to Text Entry field in Qualtrics
            var textArea = document.getElementById('QR~QID2'); // Ensure this ID matches the Textarea ID in Qualtrics
            if (textArea) {
                // Save distance in the first line of Text Entry
                textArea.value = `Distance: ${distance.toFixed(2)} km\nPath: ${pathData}\nAddresses: ${addressData}`;
                console.log("Data saved to Text Entry:", textArea.value);
            } else {
                console.error('Text Entry element not found');
            }
        }
    </script>
</body>
</html>
