<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leaflet Map with Geocoder</title>

    <!-- 引入Leaflet和Geocoder样式与脚本 -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet-control-geocoder/dist/Control.Geocoder.css" />
    <script src="https://cdn.jsdelivr.net/npm/leaflet-control-geocoder/dist/Control.Geocoder.js"></script>
</head>
<body>
    <!-- 地图容器 -->
    <div id="map" style="height: 500px; width: 100%;"></div>
    <!-- 显示路径信息的容器 -->
    <div id="result"></div>
    <!-- 清除按钮 -->
    <button id="clearButton">Clear Route</button>

    <!-- 显示地址列表的容器 -->
    <div id="addressList" style="max-height: 300px; overflow-y: auto; border: 1px solid #ccc; padding: 10px;">
        <!-- 地址项将在这里显示 -->
    </div>

    <script>
        // 创建地图
        var map = L.map('map').setView([51.505, -0.09], 13);

        // 添加OpenStreetMap图层
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

        // 创建Geocoder控件
        var geocoder = L.Control.Geocoder.nominatim();

        var route = [];
        var addresses = [];

        // 添加点击事件，获取地址并绘制路径
        map.on('click', function(e) {
            // 获取点击位置的经纬度
            var latlng = e.latlng;

            // 使用Geocoder反向获取地址
            geocoder.reverse(latlng, map.options.crs.scale(map.getZoom()), function(results) {
                var result = results[0];
                if (result) {
                    // 显示地址列表
                    var address = result.name;
                    addresses.push(address);
                    var addressDiv = document.createElement('div');
                    addressDiv.innerHTML = address;
                    document.getElementById('addressList').appendChild(addressDiv);

                    // 添加路径到地图
                    route.push(latlng);
                    if (route.length > 1) {
                        var polyline = L.polyline(route, {color: 'blue'}).addTo(map);
                        document.getElementById('result').innerText = `路径: ${route.length}个点`;
                    }

                    // 发送路径信息到父页面
                    sendDataToParent(route, addresses);
                }
            });
        });

        // 清除按钮功能
        document.getElementById('clearButton').addEventListener('click', function() {
            route = [];
            addresses = [];
            document.getElementById('addressList').innerHTML = '';
            document.getElementById('result').innerText = '';
            map.eachLayer(function(layer) {
                if (layer instanceof L.Polyline) {
                    map.removeLayer(layer);
                }
            });
        });

        // 发送数据到父页面（Qualtrics）
        function sendDataToParent(route, addresses) {
            const data = {
                distance: calculateDistance(route),
                path: route.join(" -> "),
                addresses: addresses.join(", ")
            };

            // 使用 postMessage 将数据传递给父页面（Qualtrics）
            window.parent.postMessage(data, "https://your-qualtrics-url.com");  // 请替换成实际的Qualtrics URL
        }

        // 计算路径的总距离（简单实现）
        function calculateDistance(route) {
            let totalDistance = 0;
            for (let i = 0; i < route.length - 1; i++) {
                totalDistance += route[i].distanceTo(route[i + 1]);
            }
            return totalDistance.toFixed(2) + " 米";  // 返回米为单位的总距离
        }
    </script>
</body>
</html>
